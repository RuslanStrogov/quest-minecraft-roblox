<text x="70" y="752" font-size="16" fill="#3d2b0a" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal">3. Вручает АЛМАЗНЫЙ КЛИНОК (картонный меч, обклеенный фольгой).</text>
