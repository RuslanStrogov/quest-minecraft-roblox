<text x="38" y="229.5" class="small" fill="#3d2b0a">2. Ведущий (мама/помощник) проверяет — ВСЁ ВЕРНО!</text>
<text x="38" y="236.0" class="small" fill="#3d2b0a">3. Вручает АЛМАЗНЫЙ КЛИНОК (картонный меч в фольге).</text>
<text x="38" y="242.5" class="small" fill="#3d2b0a">Рецепт: 3 × Кристалл Глубины = Алмазный Клинок +1</text>
